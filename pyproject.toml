[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "AI code review prototype for catching AI-generated code smells"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-google-genai>=1.0.1",
    "langchain-groq>=0.0.1",
    "langchain-openai>=0.0.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ai-agent = "main:main"

[tool.setuptools]
py-modules = ["main", "review_engine", "review_types", "diff_parser"]
