[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "AI code review prototype for catching AI-generated code smells"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
    "pytest>=7.0.0",
]

[project.scripts]
ai-agent = "main:main"

[tool.setuptools]
py-modules = ["main", "review_engine", "review_types", "diff_parser", "github_integration"]
